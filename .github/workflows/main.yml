
name: Build MX CRAFT APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MX-CRAFT-APK
          path: android/build/outputs/apk/debug/android-debug.apk
